# GitHub Actions workflow for running Checkstyle on Java source code
# This workflow enforces coding standards on every push or pull request to main

name: checkstyle

on:
  push:
    branches: [ "main" ]

  # Run on pull requests targeting the main branch
  pull_request:
    branches: [ "main" ]

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Download the Checkstyle JAR
      - name: Download Checkstyle
        run: |
          mkdir -p tools
          wget -O tools/checkstyle.jar \
            https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.6/checkstyle-10.12.6-all.jar

      # Run Checkstyle on Java source files only
      # Using Google's built-in Checkstyle ruleset
      - name: Run Checkstyle
        run: |
          java -jar tools/checkstyle.jar \
            core/src/main/java \
            -c /google_checks.xml
